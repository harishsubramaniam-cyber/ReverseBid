{% extends "base.html" %}
{% block title %}{{ code }} — {{ app_name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:8vh auto;text-align:center">
  <div style="font-size:2.4rem">{{ '🔒' if code == 403 else '🧭' }}</div>
  <h1>{{ 'You do not have access' if code == 403 else 'We could not find that' }}</h1>
  <p class="muted">{{ message }}</p>
  <div class="btn-row" style="justify-content:center">
    <a class="btn" href="/">Back to the dashboard</a>
    <a class="btn ghost" href="/auctions">See auctions</a>
  </div>
</div>
{% endblock %}
